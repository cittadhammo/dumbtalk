services:
  cloudphone-signal:
    build: .
    image: cloudphone-signal:local
    container_name: cloudphone-signal
    restart: unless-stopped
    environment:
      WIDGET_TOKEN: ${WIDGET_TOKEN:?Set WIDGET_TOKEN in .env}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
      DEVICE_NAME: ${DEVICE_NAME:-DumbTalk}
      SIGNAL_CLI_AUTO_UPDATE: ${SIGNAL_CLI_AUTO_UPDATE:-true}
      SIGNAL_CLI_UPDATE_MIN_AGE_HOURS: ${SIGNAL_CLI_UPDATE_MIN_AGE_HOURS:-24}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      WACLI_DEVICE_LABEL: ${WACLI_DEVICE_LABEL:-DumbTalk}
      WACLI_SYNC_MAX_MESSAGES: ${WACLI_SYNC_MAX_MESSAGES:-50000}
      WACLI_SYNC_MAX_DB_SIZE: ${WACLI_SYNC_MAX_DB_SIZE:-1GB}
    volumes:
      - ./data:/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8787}:8080"
